name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes the one in flight. main is exempt
# so every commit there keeps a result of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      # Offline checks: lint, schema, template tokens, the outbound-host
      # allowlist, the safety hook in both dialects, and dist/ drift.
      - name: Test
        run: ./tests/run.sh

      # dist/ is committed and is what the marketplaces install. If it does not
      # match what build.sh produces from core/, the published artefact and the
      # source have diverged.
      #
      # `git status --porcelain -uall`, not `git diff` — a new host or skill adds
      # *untracked* files under dist/ and the marketplace dirs, and git diff is
      # blind to those. The "Adding a host" flow in AGENTS.md hits exactly that
      # case, so the weaker check would pass on the one change most likely to
      # ship a stale artefact.
      - name: dist/ is in sync with core/
        run: |
          ./build.sh
          changed="$(git status --porcelain -uall -- dist .claude-plugin .agents .cursor-plugin)"
          if [ -n "$changed" ]; then
            echo "::error::dist/ is stale — run ./build.sh and commit the result"
            echo "$changed"
            git diff -- dist .claude-plugin .agents .cursor-plugin
            exit 1
          fi

  # Validates the generated manifests against each HOST's own publication
  # validator — Cursor's JSON schemas, Codex's validate_plugin.py, and Claude
  # Code's `plugin validate --strict` — rather than against rules this repo
  # wrote down about them. Each file artefact is fetched at a pinned commit SHA
  # and checked against a recorded sha256 before it is parsed or executed; see
  # tests/upstream.pins.json.
  #
  # NOT continue-on-error, unlike `network` below. An upstream outage there is
  # somebody else's bad day; a manifest that violates a host's publication
  # schema is a defect that reaches a marketplace. A host's runtime loader is
  # more lenient than its validator in every case here, so a local install
  # looking fine proves nothing about whether the bundle can be published.
  upstream-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Pinned for the same reason the actions are: these run on the runner.
      - name: Install validator dependencies
        run: pip install jsonschema==4.26.0 pyyaml==6.0.3

      # Claude Code publishes no standalone schema — its CLI is the validator,
      # so the pin is an npm version. Read from the pins file so there is one
      # place to bump, and so tests/upstream.sh can assert the runner really got
      # the version it claims to be testing against.
      - name: Install pinned Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@$(jq -r '.clis["claude-code"].version' tests/upstream.pins.json)"

      - run: ./tests/upstream.sh

  network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Live retrieval against docs.megaport.com, the Terraform Registry and the
    # megaport-cli releases. Kept separate so an upstream outage does not block
    # a pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y jq unzip
      - run: ./tests/run.sh --network

  cross-platform:
    # macOS ships bash 3.2 (the runner image confirms 3.2.57 and installs no
    # Homebrew bash, so `#!/usr/bin/env bash` really does resolve to it). Every
    # runtime script targets it deliberately; this is where that claim gets
    # checked rather than assumed.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install jq shellcheck
      # Assert, don't just print. If a future image puts a Homebrew bash ahead
      # of /bin/bash on PATH, this job would quietly start testing bash 5 and
      # the 3.2 guarantee would lapse without anyone noticing.
      - name: Runner bash really is 3.2
        run: |
          # `bash` on PATH is what `#!/usr/bin/env bash` in core/lib resolves to.
          v="$(bash -c 'echo "$BASH_VERSION"')"
          echo "bash on PATH: $(command -v bash) -> $v"
          case "$v" in
            3.2*) ;;
            *) echo "::error::expected bash 3.2 on the macOS runner, got $v"; exit 1 ;;
          esac
      - run: ./tests/run.sh
